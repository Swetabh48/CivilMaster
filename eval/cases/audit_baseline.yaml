# Audit baseline — Appendix A of ARCHITECTURE_AND_PLAN.md
id: audit_01_ss_udl
topic: beam_analysis
question: >
  A simply supported beam of span 6 m carries a UDL of 20 kN/m over the entire span.
  Draw the SFD and BMD and find the maximum bending moment.
expect:
  status: verified
  answers:
    - label_contains: M
      value_kNm: 90.0
      tol_pct: 2
    - label_contains: V
      value_kN: 60.0
      tol_pct: 2
  require_diagram: true
---
id: audit_02_ss_points
topic: beam_analysis
