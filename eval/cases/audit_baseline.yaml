id: audit_06_bending_stress
topic: bending_stress
question: >
  A rectangular beam 200 mm wide and 400 mm deep is subjected to a bending moment of 50 kNm.
  Find the maximum bending stress.
expect:
  status: verified
  answers:
    - label_contains: sigma
      # σ = M y / I = 50e6 * 200 / (200*400^3/12) = 9.375 N/mm²
      value_N_per_mm2: 9.375
      tol_pct: 2
  require_diagram: false
---
id: audit_07_soil
topic: phase_relations
question: >
  A soil sample has a bulk density of 1.9 g/cc and water content 12%. G = 2.7.
  Find void ratio and degree of saturation.
expect:
  status: verified
  answers:
    - label_contains: e
      value: 0.589
      tol_pct: 5
    - label_contains: S
      value: 0.55
      tol_pct: 10
  require_diagram: false
